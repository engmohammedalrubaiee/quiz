<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة الكويزات – الجامعة الإماراتية الدولية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

<style>
/* ============================================================
   🎨 الألوان والخطوط — عدّل القيم هنا لتغيير شكل التطبيق
   ============================================================ */
:root{
  --bg:#EEF2FA; --card:#FFFFFF; --ink:#14284B; --muted:#62708F; --line:#D9E0F0;
  --primary:#1F4E96; --primary-2:#3C7BE0; --accent:#E8B53A;
  --ok:#12A37A; --ok-bg:#E2F7EF; --bad:#D92D45; --bad-bg:#FDE8EC;
  /* ألوان الشعار في الوضع النهاري */
  --logo-navy:#1B3866; --logo-red:#A82339; --logo-edge:transparent;
  --radius:22px; --shadow:0 10px 30px rgba(20,40,90,.12);
  --font:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0E1730; --card:#172447; --ink:#EEF2FF; --muted:#93A2CC; --line:#27386A;
  --primary:#5B97F0; --primary-2:#7FB0FF;
  --ok-bg:#103A31; --bad-bg:#43202B; --shadow:0 10px 30px rgba(0,0,0,.4);
  /* ألوان الشعار في الوضع الليلي: نصوص فاتحة + حافة خفيفة تُظهر الدرع */
  --logo-navy:#E3ECFF; --logo-red:#FF6F82; --logo-edge:#7FA2E6;
}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);color:var(--ink);background:var(--bg);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(circle at 95% 0%,color-mix(in srgb,var(--primary-2) 24%,transparent),transparent 45%),
             radial-gradient(circle at 0% 100%,color-mix(in srgb,#C8202F 12%,transparent),transparent 40%)}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.i{flex:none;display:block}

/* ألوان الشعار القابلة للتبديل */
.ln{fill:var(--logo-navy)} .lr{fill:var(--logo-red)}
.lrs{stroke:var(--logo-red)} .le{stroke:var(--logo-edge)}

.app{max-width:780px;margin:0 auto;padding:14px 16px 40px;min-height:100vh;display:flex;flex-direction:column}

/* الشريط العلوي */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brand{flex:1;display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;text-align:right}
.brand svg{height:50px;width:auto}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.icon-btn[hidden]{display:none}

/* ===== شاشة الترحيب (خلفية داكنة دائماً بألوان شعار ليلية) ===== */
.splash{--logo-navy:#E3ECFF;--logo-red:#FF6F82;--logo-edge:#8FB0F0;
  position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center;
  background:radial-gradient(circle at 50% 30%,#24508F 0%,#12295A 55%,#0A1630 100%);color:#fff;transition:opacity .6s,transform .6s}
.splash.out{opacity:0;transform:scale(1.05);pointer-events:none}
.splash .logo{width:min(70vw,290px);filter:drop-shadow(0 18px 40px rgba(0,0,0,.45));animation:logoIn .9s cubic-bezier(.2,.9,.25,1.1) both}
.splash .logo svg{width:100%;height:auto;display:block}
.splash h1{font-size:clamp(24px,6vw,34px);font-weight:800;margin-top:14px;animation:up .7s .5s both}
.splash p{opacity:.85;font-size:17px;animation:up .7s .7s both}
.splash .btn{margin-top:16px;background:#fff;color:#12295A;animation:up .7s .95s both}
@keyframes logoIn{from{opacity:0;transform:translateY(40px) scale(.7)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}}

/* ===== الصفحات ===== */
.screen{animation:enter .35s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hero{margin:4px 0 18px}
.hero h1{font-size:clamp(26px,6.5vw,36px);font-weight:800;line-height:1.35}
.hero p{color:var(--muted);margin-top:6px;font-size:16px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.crumbs span{background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary);font-size:13px;font-weight:800;padding:4px 12px;border-radius:99px}

/* مؤشر الخطوات */
.steps{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--line);transition:background .3s}
.steps i.on{background:linear-gradient(90deg,var(--primary),var(--primary-2))}
.steps span{font-size:13px;font-weight:800;color:var(--muted);min-width:70px;text-align:left}

/* شبكة الخيارات */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tile{background:var(--card);border:2px solid transparent;border-radius:20px;padding:18px;text-align:right;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
.tile:hover{transform:translateY(-3px);border-color:var(--tc,var(--primary))}
.tile:active{transform:scale(.97)}
.tile .ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--tc,var(--primary));color:#fff}
.tile .tx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.tile b{font-size:17px;line-height:1.4}
.tile small{color:var(--muted);font-size:13px}
.tile .go{color:var(--muted);opacity:.7}
.tile.empty{opacity:.72}
.tile.big{flex-direction:column;align-items:flex-start;padding:22px}
.grid.two{grid-template-columns:1fr 1fr}
.grid.two .tile{flex-direction:column;align-items:center;text-align:center;padding:26px 12px}
.grid.two .tx{align-items:center;flex:none}

.empty-box{background:var(--card);border-radius:20px;padding:30px 18px;text-align:center;border:2px dashed var(--line)}
.empty-box .eic{width:68px;height:68px;border-radius:20px;margin:0 auto 12px;display:grid;place-items:center;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary)}
.empty-box h3{font-size:19px;margin-bottom:6px}
.empty-box p{color:var(--muted);line-height:1.8;font-size:15px}

.switch{display:flex;align-items:center;gap:10px;margin:18px 4px 0;color:var(--muted);font-size:15px;user-select:none}
.switch input{width:20px;height:20px;accent-color:var(--primary)}

/* الكويز */
.progress{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.bar{flex:1;height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--primary-2));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.count{font-weight:800;font-size:14px;color:var(--muted);min-width:54px;text-align:left}
.score-chip{background:var(--accent);color:#3a2b00;font-weight:800;font-size:14px;padding:5px 12px;border-radius:99px;display:flex;align-items:center;gap:4px}
.qcard{background:var(--card);border-radius:var(--radius);padding:24px 20px;box-shadow:var(--shadow)}
.qtag{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--primary) 13%,transparent);color:var(--primary);font-weight:800;font-size:13px;padding:5px 12px;border-radius:99px;margin-bottom:14px}
.qtext{font-size:clamp(20px,4.8vw,25px);font-weight:800;line-height:1.7}
.options{display:grid;gap:12px;margin-top:20px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:right;background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:13px 15px;font-size:18px;font-weight:600;line-height:1.6;transition:transform .15s,border-color .2s,background .2s}
.opt:hover:not(:disabled){border-color:var(--primary);transform:translateX(-4px)}
.opt .k{flex:none;width:36px;height:36px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-weight:800;color:var(--primary);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);animation:pop .4s}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);animation:shake .4s}
.opt.bad .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.5}
@keyframes pop{50%{transform:scale(1.03)}}
@keyframes shake{25%{transform:translateX(8px)}50%{transform:translateX(-8px)}75%{transform:translateX(5px)}}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{flex-direction:column;justify-content:center;text-align:center;padding:22px 10px;font-size:21px;font-weight:800}
.tf .opt .k{width:52px;height:52px;border-radius:50%}

.feedback{margin-top:16px;padding:12px 16px;border-radius:16px;font-weight:700;display:none;align-items:center;gap:10px;flex-wrap:wrap}
.feedback.show{display:flex;animation:enter .3s}
.feedback.ok{background:var(--ok-bg);color:var(--ok)}
.feedback.bad{background:var(--bad-bg);color:var(--bad)}
.feedback .msg{flex:1;min-width:150px}
.exp-btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#3a2b00;font-weight:800;font-size:15px;padding:9px 16px;border-radius:12px;animation:pop .4s}
.exp{display:none;margin-top:12px;padding:14px 16px;border-radius:16px;background:color-mix(in srgb,var(--accent) 16%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 60%,transparent);line-height:1.9;font-size:16px}
.exp.show{display:block;animation:enter .3s}
.exp b{display:flex;align-items:center;gap:6px;margin-bottom:4px;color:#9a6b00}
:root[data-theme="dark"] .exp b{color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-weight:800;font-size:18px;padding:15px 28px;border-radius:18px;box-shadow:0 8px 20px color-mix(in srgb,var(--primary) 35%,transparent);transition:transform .15s}
:root[data-theme="dark"] .btn:not(.ghost){color:#0E1730}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.actions .btn{flex:1}

.result{text-align:center}
.ring{width:190px;height:190px;margin:10px auto 6px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:url(#rg);stroke-dasharray:502;stroke-dashoffset:502;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:42px;font-weight:800}
.result h2{font-size:25px;margin-top:8px}
.result p{color:var(--muted);margin-top:6px}
.review{margin-top:22px;text-align:right}
.review h3{margin-bottom:10px}
.rev{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);border-inline-start:5px solid var(--bad)}
.rev b{display:block;line-height:1.7}
.rev .a{color:var(--ok);font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;margin-top:4px}
.rev .e{color:var(--muted);font-size:14px;line-height:1.8;margin-top:6px}

.footer{margin-top:auto;padding-top:30px;text-align:center;color:var(--muted);font-size:14px}
.dev{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;background:var(--card);padding:10px 18px;border-radius:99px;box-shadow:var(--shadow)}
.dev a{color:var(--primary);font-weight:800;text-decoration:none;direction:ltr;display:inline-flex;align-items:center;gap:6px}

.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
@media (max-width:420px){.tf .opt{font-size:18px}.opt{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== إضافات النسخة الجديدة ===== */
.drawer-bg{position:fixed;inset:0;background:rgba(5,12,30,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-bg.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(300px,84vw);background:var(--card);z-index:61;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:calc(env(safe-area-inset-top,0px) + 16px) 14px 20px;display:flex;flex-direction:column;gap:4px;overflow:auto;box-shadow:var(--shadow)}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:19px}
.nav{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;font-weight:800;font-size:16px;text-align:right;width:100%}
.nav:hover,.nav.cur{background:color-mix(in srgb,var(--primary) 13%,transparent);color:var(--primary)}
.field{display:grid;gap:8px;margin-top:14px}
.field label{font-weight:800;font-size:14px;color:var(--muted)}
input[type=number],input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:11px 14px;width:100%}
input:focus,select:focus,textarea:focus{outline:3px solid var(--accent);outline-offset:1px}
textarea{min-height:220px;line-height:1.9;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 16px;border-radius:99px;background:var(--bg);border:2px solid var(--line);font-weight:800;font-size:14px}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
:root[data-theme="dark"] .chip.on{color:#0E1730}
.panel{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.panel h3{margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:right}
.row:last-child{border:0}
.sw{position:relative;width:48px;height:27px;border-radius:99px;background:var(--line);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:right .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.sw.on{background:var(--primary)}.sw.on::after{right:24px}
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--primary))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:18px;padding:14px 6px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px}.stat small{color:var(--muted);font-size:12px}
.opt.sel{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,var(--bg))}
.opt.sel .k{background:var(--primary);color:#fff}
.tag{font-size:12px;font-weight:800;padding:2px 10px;border-radius:99px;margin-inline-start:6px}
.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.ok{background:var(--ok-bg);color:var(--ok)}
.rev.ok{border-color:var(--ok)}.rev .y{font-size:15px;margin-top:6px;color:var(--muted)}
details>summary{cursor:pointer;font-weight:800;padding:6px 0}
.warn{color:var(--bad);font-weight:800}
.note{background:color-mix(in srgb,var(--accent) 18%,var(--card));border-radius:16px;padding:12px 16px;margin-bottom:14px;font-weight:700;line-height:1.8}

.splash{--logo-navy:#1B3866;--logo-red:#A82339;--logo-edge:transparent;background:radial-gradient(circle at 50% 26%,color-mix(in srgb,var(--primary-2) 24%,var(--bg)),var(--bg) 68%);color:var(--ink)}
:root[data-theme="dark"] .splash{--logo-navy:#E3ECFF;--logo-red:#FF6F82;--logo-edge:#7FA2E6}
.splash .logo{filter:drop-shadow(0 10px 22px rgba(20,40,90,.16))}
.splash p{color:var(--muted);opacity:1}
.splash .btn{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff}
:root[data-theme="dark"] .splash .btn{color:#0E1730}
.drawer{visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s}
.drawer.on{visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.feedback{margin-top:12px;padding:6px 12px;font-size:14px;border-radius:12px;gap:8px;width:fit-content}
.feedback .msg{flex:none;min-width:0}
.exp-btn{font-size:13px;padding:5px 10px;border-radius:10px;gap:5px}
.noanim{animation:none!important}
.mini{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--muted);background:var(--card);padding:6px 10px;border-radius:99px;box-shadow:var(--shadow);white-space:nowrap}
.mini[aria-pressed="true"]{color:var(--primary)}
.tree summary{display:flex;align-items:center;gap:10px;padding:8px 0}
.tree details details{margin-inline-start:16px}
.tree .ck{width:20px;height:20px;accent-color:var(--primary);flex:none}
/* ===== الوضع الليلي: رمادي فحمي احترافي ===== */
:root[data-theme="dark"]{--bg:#0C0E13;--card:#151922;--ink:#ECEFF5;--muted:#9099AA;--line:#262C38;--primary:#6BA4FF;--primary-2:#8FBAFF;--ok:#2FC79A;--ok-bg:#0E2B24;--bad:#FF6B7D;--bad-bg:#35151C;--shadow:0 10px 30px rgba(0,0,0,.5)}
:root[data-theme="dark"] body::before{background:radial-gradient(circle at 95% 0%,rgba(107,164,255,.09),transparent 45%),radial-gradient(circle at 0% 100%,rgba(232,181,58,.05),transparent 40%)}
:root[data-theme="dark"] .splash{background:radial-gradient(circle at 50% 26%,#1D2331,var(--bg) 68%)}
:root[data-theme="dark"] .btn:not(.ghost),:root[data-theme="dark"] .splash .btn,:root[data-theme="dark"] .chip.on{color:#0C0E13}
:root[data-theme="dark"] .opt.ok .k,:root[data-theme="dark"] .opt.bad .k,:root[data-theme="dark"] .opt.sel .k{color:#0C0E13}

/* ===== الحساب أعلى الشاشة ===== */
.acct{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:right;padding:2px 0}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-2));box-shadow:0 4px 12px color-mix(in srgb,var(--primary) 35%,transparent)}
:root[data-theme="dark"] .av{color:#0C0E13}
.bcol{display:flex;flex-direction:column;align-items:flex-start;line-height:1.3;min-width:0}
.bcol b{font-size:15px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcol small{font-size:11px;color:var(--muted);font-weight:700}
.bcol small[hidden]{display:none}
.dacct{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:12px;margin-bottom:8px;border-radius:16px;background:color-mix(in srgb,var(--primary) 10%,var(--bg));border:1px solid var(--line)}
.dacct .av{width:46px;height:46px;font-size:19px}
.pfx{flex:none;color:var(--primary);font-weight:800;font-size:18px}

/* ===== التنبيهات المنبثقة (Toast) ===== */
.toasts{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16vh);z-index:400;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 18px;pointer-events:none}
.toast{--tcol:#3C7BE0;pointer-events:auto;display:flex;align-items:center;gap:9px;max-width:min(340px,100%);padding:8px 14px 8px 10px;border-radius:99px;color:#fff;font-weight:700;font-size:13.5px;line-height:1.5;
  background:color-mix(in srgb,var(--tcol) 72%,transparent);border:1px solid color-mix(in srgb,#fff 28%,transparent);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);box-shadow:0 8px 24px rgba(0,0,0,.22);animation:tIn .32s cubic-bezier(.2,.9,.3,1.1) both;cursor:pointer}
.toast.ok{--tcol:#12A37A}.toast.err{--tcol:#E0364D}.toast.warn{--tcol:#E8A317;color:#2b1f00}.toast.info{--tcol:#3C7BE0}
.toast .ti{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.26)}
.toast.warn .ti{background:rgba(0,0,0,.12)}
.toast .ti svg{width:14px;height:14px}
.toast .tm{flex:1}

<script>
/* ==================================================================
   📘 قسم البيانات — كل ما تحتاج تعديله موجود في هذا القسم فقط
   ==================================================================
   البناء (كل مستوى داخل تخصص، وكل ترم داخل مستوى، وكل مادة داخل ترم):

       SPEC("اسم التخصص", "أيقونة", "#لون", [
         LEVEL("المستوى الأول", [
           TERM("الترم الأول",  [ sub("arabic"), sub("math1", {...}) ]),
           TERM("الترم الثاني", [ ... ])
         ])
       ])

   ▸ كل ترم في كل تخصص مستقل تماماً: أسئلة مادة في الترم الأول لا تظهر في الثاني،
     ولا في أي تخصص آخر حتى لو كانت المادة بنفس الاسم.
   ▸ مادة في ترم          : sub("مفتاح_المادة")  داخل TERM الخاص بها.
   ▸ مادة بأسئلة          : sub("circuits", { mcq:`...`, tf:`...` })
   ▸ مادة خاصة بتخصص      : sub({ name:"اسم المادة", icon:"book", color:"#1F4E96" }, { mcq:`...` })
   ▸ مادة جديدة دائمة     : أضف سطراً في LIB ثم استخدم مفتاحها في أي ترم.
   ▸ ترم/مستوى/تخصص جديد  : انسخ القالب في آخر SPECS (داخل التعليق) وعدّل الأسماء.
   ▸ أيقونات: cog bolt sigma triangle chat globe book layers
   ▸ لا تغيّر اسم الترم أو المادة بعد بدء الطلاب بالاستخدام (يرتبط تقدمهم بالاسم).
   ▸ أي خطأ في الكتابة (اسم مكرر، مفتاح مادة خاطئ، لون/أيقونة غير صحيحة، سؤال غير مقروء)
     لا يُعطّل التطبيق: يُتجاهل ويظهر لك تنبيه في «فهرس المحتوى» من القائمة (نقطة حمراء ●).

   ▸ صيغة الاختيار من متعدد (mcq): سطر السؤال ثم الاختيارات، علامة * بعد الصحيح،
     وبعده توضيح اختياري بين قوسين (يظهر زر «توضيح السؤال»)، وسطر فارغ بين الأسئلة:
          ما وحدة قياس المقاومة؟
          الفولت
          الأوم* (R = V / I)
          الأمبير
   ▸ صيغة صح/خطأ (tf) سطر لكل سؤال:   نص السؤال ✔    أو   نص السؤال ✘ (توضيح)
*/
const PHONE    = "778844449";        // رقم الجوال بدون صفر وبدون رمز الدولة
const WHATSAPP = "967" + PHONE;      // يُستخدم لإرسال الأسئلة والاقتراحات

const LIB = {

/* دوال البناء — تضمن شكلاً موحداً للبيانات */
const SPEC  = (name, icon, color, levels, tag)  => ({ name, icon, color, levels, tag });
const LEVEL = (name, terms)                => ({ name, terms });

const SPECS = [
  /* الخطة الدراسية المعتمدة لبرنامج هندسة الميكاترونكس – نظام 4 سنوات (151 ساعة) – قرار وزاري 107 لسنة 1447هـ */
  SPEC("هندسة الميكاترونكس", "cog", "#1F4E96", [

    LEVEL("المستوى الأول", [
      TERM("الترم الأول", [
        sub("ar1", {
          /* ⭐ = أسئلة جاءت في امتحان نهاية الفصل الأول (2026-2027) */
          mcq:`
⭐2026 من أهمية الاستماع:
اكتشاف الأفكار
نطق الحروف
الثقة بالنفس
التدريب على حسن الإصغاء*

⭐2026 هي رسم لرموز الكلمات في أشكال متعارف عليها:

الإلقاء
الكتابة*
المهارة

⭐2026 من علامات فعل الأمر:
قبول حروف النداء
دلالته على الطلب*
الإعراب بالحركات الأصلية
دخول أدوات الجزم عليه

⭐2026 مهارة التحدث:
مكتسبة*
فطرية
تستند على القراءة
تقيس شخصية الفرد
`,

⭐2026 تكتب الهمزة آخر الكلمة على الواو إذا كان ما قبلها مفتوح. ✘ (تكتب على الألف إذا كان ما قبلها مفتوحاً)
⭐2026 الحروف كلها مبنية. ✔

`

function splitExp(line){
  const m = line.match(/[\(（]([^()（）]*)[\)）]\s*$/);

function pastOf(line){const m=line.match(PAST_RE);return m?{text:line.slice(m[0].length).trim(),past:true,year:m[1]||""}:{text:line,past:false,year:""}}
function parseMCQ(text){
  return (text||"").trim().split(/\n\s*\n/).map(block=>{
    const L = block.split("\n").map(s=>s.trim()).filter(Boolean);
    if(L.length<3) return null;
    let correct=-1, exp=null;
    const opts = L.slice(1).map((l,i)=>{
      if(l.includes("*")){
        const s = splitExp(l); l = s.text; exp = s.exp;
        if(/^\*|\*$/.test(l)){ correct=i; l=l.replace(/^\*\s*|\s*\*$/g,""); }
      }
      return l;
    });
    const p=pastOf(L[0]);
    return correct<0 ? null : {type:"mcq", q:p.text, opts, correct, exp, past:p.past, year:p.year};
  }).filter(Boolean);
}
function parseTF(text){
  return (text||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const m = l.match(/^(.*?)\s*(✔|✓|✅|✘|✗|✖|❌|\|\s*صح|\|\s*خطأ|\|\s*خطا)\s*(?:[\(（]([^()（）]*)[\)）])?\s*$/);
    if(!m) return null;
    const p=pastOf(m[1]);
    return {type:"tf", q:p.text, answer:/✔|✓|✅|صح/.test(m[2]), exp:m[3]?m[3].trim():null, past:p.past, year:p.year};
  }).filter(Boolean);
}

/* ---------- خيارات الاختبار المشتركة ---------- */
const tg=(id,t,on)=>`<div class="row"><span>${t}</span><button class="sw ${on?"on":""}" id="${id}" role="switch" aria-checked="${!!on}"></button></div>`;
const flip=b=>{b.classList.toggle("on");b.setAttribute("aria-checked",b.classList.contains("on"))};
function optsHTML(){return `<div class="panel"><div class="field" style="margin:0 0 6px"><label>عدد الأسئلة</label><div class="chips" id="cnts">${[5,10,20,0].map(n=>`<button class="chip ${U.count===n?"on":""}" data-n="${n}">${n||"الكل"}</button>`).join("")}</div><input type="number" id="cnt" min="1" placeholder="أو اكتب عدداً آخر" value="${U.count&&![5,10,20].includes(U.count)?U.count:""}"></div>${tg("oShuf","ترتيب عشوائي للأسئلة",U.shufQ)}${tg("oSkip","عدم تكرار الأسئلة التي اختبرتها سابقاً",U.skipSeen)}</div>`}
function bindOpts(){
  const cs=[...view.querySelectorAll("#cnts .chip")];
  view.querySelectorAll(".sw").forEach(b=>b.onclick=()=>flip(b));
  cs.forEach(c=>c.onclick=()=>{cs.forEach(x=>x.classList.toggle("on",x===c));$("#cnt").value=""});
  $("#cnt").oninput=()=>cs.forEach(x=>x.classList.remove("on"));
}
function readOpts(){
  const on=id=>$("#"+id).classList.contains("on"),ch=$("#cnts .chip.on"),v=+$("#cnt").value;
  const o={count:v>0?v:ch?+ch.dataset.n:0,shuf:on("oShuf"),skip:on("oSkip")};
  Object.assign(U,{count:o.count,shufQ:o.shuf,skipSeen:o.skip});saveU();return o;
}
function shuffleMCQ(q){const ord=shuffle(q.opts.map((_,i)=>i));return{...q,opts:ord.map(i=>q.opts[i]),correct:ord.indexOf(q.correct)}}
function makeQuiz(pool,o,title){
  let qs=pool;
  if(o.skip){qs=qs.filter(q=>!PROG[q.id]);if(!qs.length){toast("اختبرت كل الأسئلة المتاحة سابقاً. أوقف خيار عدم التكرار أو صفّر تقدم المادة.","warn");return}}
  if(o.shuf)qs=shuffle(qs);
  if(o.count)qs=qs.slice(0,o.count);
  qs=qs.map(q=>q.type==="mcq"&&U.shufO?shuffleMCQ(q):q);
  go("quiz",{quiz:{qs,i:0,score:0,res:[],ans:[],rec:[],instant:U.fb!==false,title,pool,o,t0:Date.now(),back:state.screen}});
}

/* ---------- الاختبار ---------- */
const cIdx=q=>q.type==="mcq"?q.correct:(q.answer?0:1);
const isRight=(q,v)=>q.type==="mcq"?v===q.correct:v===q.answer;
function record(i){   /* تسجيل الإجابة في التقدم (آمن للتكرار عند تغيير الإجابة) */
  const Q=state.quiz,q=Q.qs[i],a=Q.ans[i];if(!a||a.v==null)return;
  const right=isRight(q,a.v),old=Q.rec[i],p=PROG[q.id]||{a:0,c:0};
  PROG[q.id]={s:q.sid,a:p.a-(old==null?0:1)+1,c:p.c-(old?1:0)+(right?1:0),l:right,t:Date.now()};
  Q.rec[i]=right;store.set("prog",PROG);
}
function leaveQuiz(){const Q=state.quiz,A=Q.ans[Q.i];if(A&&A.v!=null&&(!Q.instant||A.conf))record(Q.i)}
function finish(){
  const Q=state.quiz;
  Q.res=Q.qs.map((q,k)=>({q,v:Q.ans[k].v,right:isRight(q,Q.ans[k].v)}));
  Q.score=Q.res.filter(r=>r.right).length;Q.dur=Math.max(1,Math.round((Date.now()-Q.t0)/60000));
  if(!(Q.o&&Q.o.noHist)){HIST.push({t:Date.now(),title:Q.title,total:Q.qs.length,score:Q.score,ids:Q.qs.map(q=>q.id)});HIST=HIST.slice(-60);store.set("hist",HIST)}go("result");
}
function viewQuiz(re){
  const Q=state.quiz,i=Q.i,q=Q.qs[i],T=Q.qs.length,last=i+1===T;
  const A=Q.ans[i]||(Q.ans[i]={v:null,conf:false,shown:false,exp:false});
  const inst=Q.instant,locked=inst&&A.conf,has=A.v!=null,right=has&&isRight(q,A.v);
  const si=!has?-1:q.type==="mcq"?A.v:(A.v?0:1);
  const cls=k=>locked?(k===si?(right?"ok":"bad"):(!right&&A.shown&&k===cIdx(q)?"ok":"")):(k===si?"sel":"");
  const dis=locked?"disabled":"";
  const body=q.type==="mcq"
    ?`<div class="options">${q.opts.map((o,k)=>`<button class="opt ${cls(k)}" ${dis}><span class="k">${SETTINGS.labels[k]||k+1}</span><span>${esc(o)}</span></button>`).join("")}</div>`
    :`<div class="options tf"><button class="opt ${cls(0)}" ${dis}><span class="k">${icon("check",26,3)}</span>صح</button><button class="opt ${cls(1)}" ${dis}><span class="k">${icon("x",26,3)}</span>خطأ</button></div>`;
  const fb=locked?`<div class="feedback show ${right?"ok":"bad"}">${icon(right?"check":"x",18,3)}<span class="msg">${right?"ممتاز":"خطأ"}</span>${!right&&!A.shown?`<button class="exp-btn" id="showA">${icon("check",16,3)}الإجابة الصحيحة</button>`:""}${q.exp?`<button class="exp-btn" id="showE">${icon("bulb",16)}توضيح السؤال</button>`:""}</div>${q.exp&&A.exp?`<div class="exp show"><b>${icon("bulb",18)}توضيح</b>${esc(q.exp)}</div>`:""}`:"";
  const main=inst&&!A.conf?(has?`<button class="btn" id="conf">${icon("check",20,3)}تأكيد</button>`:""):((inst?A.conf:has)?`<button class="btn" id="next">${last?"إنهاء وعرض النتيجة":"التالي"}${icon("next",20)}</button>`:"");
  const prev=i>0?`<button class="btn ghost" id="prev" style="flex:.55">${icon("back",20)}السابق</button>`:"";
  const answered=Q.ans.filter(a=>a&&a.v!=null&&(!inst||a.conf)).length;
  const tgl=`${icon(inst?"eye":"eyeoff",16)}${inst?"تصحيح فوري":"تصحيح بالنهاية"}`;
  view.innerHTML=`<section class="screen ${re?"noanim":""}"><div class="progress"><div class="bar"><i style="width:${answered/T*100}%"></i></div><span class="count">${i+1} / ${T}</span><button class="mini" id="fbT" aria-pressed="${!!inst}" aria-label="تبديل إظهار الصح والخطأ">${tgl}</button></div>
    <div class="qcard"><div class="qhead"><div class="qtags"><span class="qtag">${icon(q.type==="mcq"?"list":"toggle",16)}${q.type==="mcq"?"اختيار من متعدد":"صح أو خطأ"} · ${esc(slab(q.sid))}</span>${q.past?`<span class="qtag pastTag">${icon("star",14)}${q.year?"جاء في اختبار "+q.year:"جاء في اختبار سابق"}</span>`:""}</div><button class="rpt" id="rpt" aria-label="الإبلاغ عن خطأ في السؤال" title="الإبلاغ عن خطأ في السؤال">${icon("flag",15)}</button></div>
    <div class="qtext">${esc(q.q)}</div>${body}${fb}</div>
    <div class="actions">${prev}${main}</div></section>`;
  $("#rpt").onclick=()=>reportQ(q);
  $("#fbT").onclick=()=>{Q.instant=!Q.instant;U.fb=Q.instant;saveU();viewQuiz(true)};
  view.querySelectorAll(".opt").forEach((b,k)=>b.onclick=()=>{if(locked)return;A.v=q.type==="mcq"?k:k===0;A.conf=false;viewQuiz(true)});
  if($("#conf"))$("#conf").onclick=()=>{A.conf=true;record(i);viewQuiz(true)};
  if($("#showA"))$("#showA").onclick=()=>{A.shown=true;viewQuiz(true)};
  if($("#showE"))$("#showE").onclick=()=>{A.exp=!A.exp;viewQuiz(true)};
  if($("#next"))$("#next").onclick=()=>{leaveQuiz();if(last)finish();else{Q.i++;viewQuiz()}};
  if($("#prev"))$("#prev").onclick=()=>{leaveQuiz();Q.i--;viewQuiz()};
}

  list("all");
  view.querySelectorAll("[data-f]").forEach(c=>c.onclick=()=>{view.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("on",x===c));list(c.dataset.f)});

function celebrate(){
  const cs=["#1F4E96","#E8B53A","#12A37A","#D92D45","#3C7BE0"];

`;
  h+=ids.length
    ?`<div class="panel" style="margin-top:14px"><div class="row"><b>اختيارك: ${ids.length} مادة · ${totQ} سؤال</b><button class="chip" id="clr">مسح الكل</button></div>${Object.keys(groups).sort().map(k=>{const g=groups[k];
        return `<div class="bgrp"><small>${esc(g.x.spec)} › ${esc(g.x.level)} › ${esc(g.x.term)}</small><div class="chips">${g.list.map(x=>`<button class="schip" style="--c:${x.color}" data-rm="${x.id}" aria-label="إزالة ${esc(x.name)}">${icon(x.icon,16)}${esc(x.name)}${icon("x",14,3)}</button>`).join("")}</div></div>`}).join("")}</div>`
    :`<div class="note" style="margin-top:14px">لم تحدد أي مادة بعد. اضغط على تخصص من الأعلى لبدء الاختيار.</div>`;
  view.innerHTML=h+`${optsHTML()}<div class="actions"><button class="btn" id="go">${icon("shuffle",20)}ابدأ الاختبار العشوائي</button></div></section>`;
  bindOpts();
  view.querySelectorAll(".tile[data-i]").forEach(b=>b.onclick=()=>pickLevel(+b.dataset.i));
  view.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{RSEL.delete(b.dataset.rm);viewRandom()});
  if($("#clr"))$("#clr").onclick=()=>{RSEL.clear();viewRandom();toast("تم مسح الاختيار.","info")};
  $("#go").onclick=()=>{
    const sel=chosenIds();if(!sel.length)return toast("حدّد مادة واحدة على الأقل لبدء الاختبار.","err");
    const pool=sel.flatMap(id=>info(id).all);if(!pool.length)return toast("المواد المحددة لا تحتوي أسئلة بعد.","warn");
    makeQuiz(pool,readOpts(),"اختبار عشوائي");
  };
}
/* النافذة 1: المستوى */
function pickLevel(a){
  const S=SPECS[a];if(!S)return;
  if(!S.levels.length)return toast("لا توجد مستويات لهذا التخصص حتى الآن.","warn");
  const col=S.color||COLORS[a%COLORS.length];
  showModal({icon:S.icon||"cog",color:col,title:"اختر المستوى",step:1,crumbs:[S.name],
    body:`<div class="mlist">`+S.levels.map((l,i)=>{const n=chosenIds().filter(id=>SUBJECTS[id].si===a&&SUBJECTS[id].li===i).length;
      return `<button class="tile" style="--tc:${col}" data-i="${i}"><span class="ico">${icon("steps",26)}</span><span class="tx"><b>${esc(l.name)}</b><small>${l.terms.length} ترم${n?" · "+n+" مادة محددة":""}</small></span>${n?`<span class="badge">${n}</span>`:`<span class="go">${icon("chev",20)}</span>`}</button>`}).join("")+`</div>`,
    bind:m=>m.querySelectorAll(".tile").forEach(b=>b.onclick=()=>pickTerm(a,+b.dataset.i))});
}
/* النافذة 2: الترم */
function pickTerm(a,b){
  const S=SPECS[a],L=S&&S.levels[b];if(!L)return;
  if(!L.terms.length)return toast("لا توجد أترام لهذا المستوى حتى الآن.","warn");
  const col=S.color||COLORS[a%COLORS.length];
  showModal({icon:"calendar",color:col,title:"اختر الترم",step:2,crumbs:[S.name,L.name],back:()=>pickLevel(a),
    body:`<div class="mlist">`+L.terms.map((t,i)=>{const n=chosenIds().filter(id=>{const x=SUBJECTS[id];return x.si===a&&x.li===b&&x.ti===i}).length;
      return `<button class="tile" style="--tc:${col}" data-i="${i}"><span class="ico">${icon("calendar",26)}</span><span class="tx"><b>${esc(t.name)}</b><small>${t.subjects.length} مادة${n?" · "+n+" محددة":""}</small></span>${n?`<span class="badge">${n}</span>`:`<span class="go">${icon("chev",20)}</span>`}</button>`}).join("")+`</div>`,
    bind:m=>m.querySelectorAll(".tile").forEach(x=>x.onclick=()=>pickSubjects(a,b,+x.dataset.i))});
}
/* النافذة 3: المواد (تحديد متعدد) */
function pickSubjects(a,b,c){
  const S=SPECS[a],L=S&&S.levels[b],T=L&&L.terms[c];if(!T)return;
  if(!T.subjects.length)return toast("لا توجد مواد في هذا الترم حتى الآن.","warn");
  const had=T.subjects.filter(x=>RSEL.has(x.id)).length;
  showModal({icon:"book",color:S.color||COLORS[a%COLORS.length],title:"اختر المواد",sub:"يمكنك تحديد أكثر من مادة.",step:3,crumbs:[S.name,L.name,T.name],back:()=>pickTerm(a,b),
    body:`<div class="mlist">`+T.subjects.map(x=>{const n=info(x.id).total,on=n&&RSEL.has(x.id);
      return `<label class="stile ${n?"":"off"} ${on?"on":""}" style="--tc:${x.color}"><input type="checkbox" value="${x.id}" ${on?"checked":""} ${n?"":"disabled"}><span class="ico">${icon(x.icon,24)}</span><span class="tx"><b>${esc(x.name)}</b><small>${n?n+" سؤال":"لا توجد أسئلة بعد"}</small></span><span class="tick">${icon("check",16,3)}</span></label>`}).join("")+`</div>`,
    foot:`<button class="btn ghost" data-a="all"></button><button class="btn" data-a="ok"></button>`,
    bind:m=>{
      const cbs=[...m.querySelectorAll('input[type="checkbox"]:not(:disabled)')],okB=m.querySelector('[data-a="ok"]'),allB=m.querySelector('[data-a="all"]');
      const upd=()=>{const n=cbs.filter(x=>x.checked).length;
        okB.innerHTML=icon("check",20,3)+"تم"+(n?" ("+n+")":"");
        allB.textContent=cbs.length&&n===cbs.length?"إلغاء الكل":"تحديد الكل";allB.disabled=!cbs.length};
      cbs.forEach(x=>x.onchange=()=>{x.closest(".stile").classList.toggle("on",x.checked);upd()});
      allB.onclick=()=>{const v=!cbs.every(x=>x.checked);cbs.forEach(x=>{x.checked=v;x.closest(".stile").classList.toggle("on",v)});upd()};
      okB.onclick=()=>{
        const chosen=cbs.filter(x=>x.checked).map(x=>x.value);
        if(!chosen.length&&!had)return toast("اختر مادة واحدة على الأقل.","warn");
        T.subjects.forEach(x=>RSEL.delete(x.id));chosen.forEach(id=>RSEL.add(id));
        /* مواد من ترم/تخصص مختلف عن الترم الحالي */
        const others=chosenIds().filter(id=>{const x=SUBJECTS[id];return !(x.si===a&&x.li===b&&x.ti===c)});
        const apply=()=>{
          others.forEach(id=>RSEL.delete(id));
          T.subjects.forEach(x=>RSEL.delete(x.id));chosen.forEach(id=>RSEL.add(id));
          closeModal();if(state.screen==="random")viewRandom();
          toast(chosen.length?"تمت إضافة "+chosen.length+" مادة إلى اختيارك.":"تمت إزالة مواد هذا الترم من اختيارك.",chosen.length?"ok":"info");
        };
        if(chosen.length&&others.length){
          ask({title:"استبدال الاختيار السابق؟",msg:"الاختبار العشوائي يسمح بمواد من تخصص واحد وترم واحد فقط. سيتم حذف اختيارك السابق من الترم أو التخصص الآخر.",yes:"استبدال",onYes:apply});
          return;
        }
        apply();
      };
      upd();
    }});
}

/* ---------- الإبلاغ عن خطأ في سؤال (يُرسل إلى واتساب) ---------- */
const RP_REASONS=["الإجابة الصحيحة غير صحيحة","خطأ إملائي أو لغوي","السؤال غير واضح أو ناقص","سؤال مكرر","مشكلة أخرى"];
function reportQ(q){
  const x=SUBJECTS[q.sid];if(!x)return;let pick=-1;
  showModal({icon:"flag",color:"var(--bad)",title:"الإبلاغ عن خطأ",sub:"ما المشكلة في هذا السؤال؟",crumbs:[x.name,x.code],
    body:`<div class="bgrp"><div class="chips" id="rpC">${RP_REASONS.map((r,i)=>`<button class="chip" data-i="${i}">${r}</button>`).join("")}</div></div>
      <div class="field"><label for="rpN">ملاحظة (اختياري)</label><textarea id="rpN" maxlength="400" style="min-height:90px" placeholder="مثال: الإجابة الصحيحة هي الخيار الثالث"></textarea></div>`,
    foot:`<button class="btn danger" data-a="go">${icon("send",20)}إرسال البلاغ</button>`,
    bind:m=>{
      const cs=[...m.querySelectorAll("#rpC .chip")];
      cs.forEach(c=>c.onclick=()=>{pick=+c.dataset.i;cs.forEach(k=>k.classList.toggle("on",k===c))});
      m.querySelector('[data-a="go"]').onclick=()=>{
        const note=m.querySelector("#rpN").value.trim();
        if(pick<0&&!note)return toast("اختر نوع المشكلة أو اكتب ملاحظة.","err");
        const ans=q.type==="mcq"?q.opts.map((o,i)=>`${SETTINGS.labels[i]||i+1}) ${o}${i===q.correct?" ✅":""}`).join("\n"):"الإجابة المسجلة: "+(q.answer?"صح":"خطأ");
        const msg=`*🚩 بلاغ عن خطأ في سؤال*\n${WL}\n👤 الاسم: ${USER?fullName():"—"}\n🎓 التخصص: ${x.spec}\n📶 المستوى: ${x.level}\n🗓 الترم: ${x.term}\n📖 المادة: ${x.name}\n🔑 الشيفرة: ${x.code}\n🆔 ${q.id}\n${WL}\n*❓ السؤال:*\n${q.q}\n\n${ans}\n${WL}\n⚠️ المشكلة: ${pick>=0?RP_REASONS[pick]:"—"}${note?"\n📝 ملاحظة: "+note:""}\n\n_أُرسل من منصة الكويزات_`;
        closeModal();waOpen(msg);toast("تم تجهيز البلاغ في واتساب. شكراً لك!","ok");
      };
    }});
}

/* ---------- أسئلة اختبارات سابقة ---------- */
const PASTSEL={sid:null};
function pastPick(){
  const subs=ALLSUBJ.filter(id=>info(id).past.length),total=subs.reduce((n,id)=>n+info(id).past.length,0);
  showModal({icon:"star",color:"#E8A317",title:"اختر المادة",sub:"تظهر هنا المواد التي فيها أسئلة سابقة فقط.",
    body:`<div class="mlist">`+addTile("#E8A317","star","كل الأسئلة السابقة",total+" سؤال في "+subs.length+" مادة","",'data-all="1"')+
      subs.map(id=>{const x=SUBJECTS[id];return addTile(x.color,x.icon,x.name,esc(x.spec)+" › "+esc(x.term)+" · "+esc(x.code),`<span class="badge" style="--tc:${x.color}">${info(id).past.length}</span>`,`data-id="${id}"`)}).join("")+`</div>`,
    bind:m=>{
      m.querySelector("[data-all]").onclick=()=>{PASTSEL.sid=null;closeModal();viewPast()};
      m.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{PASTSEL.sid=b.dataset.id;closeModal();viewPast()});
    }});
}
function viewPast(){
  const subs=ALLSUBJ.filter(id=>info(id).past.length),total=subs.reduce((n,id)=>n+info(id).past.length,0);
  if(PASTSEL.sid&&!subs.includes(PASTSEL.sid))PASTSEL.sid=null;
  const x=PASTSEL.sid&&SUBJECTS[PASTSEL.sid];
  const head=`<div class="hero"><h1>أسئلة اختبارات سابقة</h1><p>أسئلة جاءت فعلاً في اختبارات سابقة. اختبر نفسك فيها لتعرف مستوى الأسئلة المتوقعة.</p></div>`;
  if(!total){view.innerHTML=`<section class="screen">${head}${emptyBox("star","لا توجد أسئلة سابقة بعد","لم يتم تمييز أي سؤال كسؤال سابق حتى الآن. سيتم إضافتها قريباً.")}</section>`;return}
  const box=x
    ?`<button class="pickbox" id="pk" style="--tc:${x.color}"><span class="ico">${icon(x.icon,24)}</span><span class="tx"><b>${esc(x.name)}</b><small>${esc(x.spec)} › ${esc(x.level)} › ${esc(x.term)}</small><span class="codechip">${esc(x.code)}</span></span><span class="go">${icon("edit",18)}</span></button>`
    :`<button class="pickbox" id="pk" style="--tc:#E8A317"><span class="ico">${icon("star",24)}</span><span class="tx"><b>كل الأسئلة السابقة</b><small>من ${subs.length} مادة · اضغط لاختيار مادة محددة</small></span><span class="go">${icon("edit",18)}</span></button>`;
  const n=x?info(x.id).past.length:total;
  view.innerHTML=`<section class="screen">${head}<div class="stats">${stat(n,"سؤال سابق")}${stat(x?1:subs.length,"مادة")}${stat(HIST.length,"اختبارات")}</div>
    <div class="panel"><div class="field" style="margin:0"><label>المادة</label>${box}</div></div>${optsHTML()}
    <div class="actions"><button class="btn" id="go">${icon("next",20)}ابدأ الاختبار</button></div></section>`;
  bindOpts();$("#pk").onclick=pastPick;
  $("#go").onclick=()=>{const pool=x?info(x.id).past:subs.flatMap(id=>info(id).past);
    makeQuiz(pool,readOpts(),x?"أسئلة سابقة – "+slab(x.id):"أسئلة سابقة");};
}

/* ---------- تقدمي وتحليل أدائي ---------- */
function viewProgress(){
  const ids=ALLSUBJ.filter(id=>info(id).total),S=ids.map(id=>({id,...sstat(id)}));
  const seen=S.reduce((a,s)=>a+s.seen,0),tot=S.reduce((a,s)=>a+s.total,0),A=S.reduce((a,s)=>a+s.a,0),C=S.reduce((a,s)=>a+s.c,0),W=S.reduce((a,s)=>a+s.weak,0);
  const weakS=S.filter(s=>s.a&&s.acc<60),rows=[...S.filter(s=>s.a).sort((a,b)=>a.acc-b.acc),...S.filter(s=>!s.a)];
  view.innerHTML=`<section class="screen"><div class="hero"><h1>تقدمي وتحليل أدائي</h1><p>كل ما أنجزته محفوظ على جهازك.</p></div>
    <div class="stats">${stat(seen+"/"+tot,"أسئلة اختبرتها")}${stat(A?Math.round(C/A*100)+"%":"—","دقتك العامة")}${stat(HIST.length,"اختبارات")}</div>
    ${weakS.length?`<div class="note">أنت ضعيف في: ${weakS.map(s=>esc(slab(s.id))).join("، ")}. ابدأ بمراجعتها.</div>`:""}
    ${W?`<div class="actions" style="margin:0 0 14px"><button class="btn" id="wk">${icon("refresh",20)}اختبرني في كل أخطائي (${W})</button></div>`:""}
    <div class="panel"><h3>المواد</h3>${rows.length?rows.map(s=>`<button class="row" style="display:block" data-id="${s.id}"><b>${esc(slab(s.id))}</b>${s.a&&s.acc<60?`<span class="tag bad">ضعيف</span>`:""}<div class="pbar"><i style="width:${s.a?s.acc:0}%;--c:${accColor(s.acc)}"></i></div><small style="color:var(--muted)">${s.seen}/${s.total} سؤال · ${s.a?"دقة "+s.acc+"%":"لم تبدأ بعد"}${s.weak?" · "+s.weak+" ضعيفة":""}</small></button>`).join(""):"<p style='color:var(--muted)'>لا توجد أسئلة بعد.</p>"}</div>
    ${HIST.length?`<div class="panel"><h3>آخر الاختبارات</h3>${HIST.slice(-8).reverse().map(h=>{const a=Math.round(h.score/h.total*100);return `<div class="row"><span>${esc(h.title)}<br><small style="color:var(--muted)">${new Date(h.t).toLocaleDateString("ar",{day:"numeric",month:"short"})}</small></span><span style="display:flex;align-items:center;gap:10px"><button class="chip" data-rt="${h.t}" aria-label="إعادة هذا الاختبار">${icon("refresh",14,3)}إعادة</button><b style="color:${accColor(a)}">${h.score}/${h.total}</b></span></div>`}).join("")}</div>`:""}</section>`;
  view.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>go("review",{sid:b.dataset.id}));
  view.querySelectorAll("[data-rt]").forEach(b=>b.onclick=()=>{
    const h=HIST.find(x=>String(x.t)===b.dataset.rt);if(!h)return;
    if(!h.ids){  /* اختبار قديم لم تُحفظ أسئلته: نعيد اختباراً بنفس المادة وعدد الأسئلة */
      const sid=ALLSUBJ.find(id=>slab(id)===h.title),pool=sid?info(sid).all:[];
      if(!pool.length)return toast("هذا الاختبار قديم ولم تُحفظ أسئلته. ستعمل الإعادة للاختبارات الجديدة.","warn");
      toast("هذا الاختبار قديم، سيتم اختبارك بأسئلة جديدة من نفس المادة.","info");
      return makeQuiz(pool,{count:h.total,shuf:true,skip:false},h.title);
    }
    const map={};ALLSUBJ.forEach(id=>info(id).all.forEach(q=>map[q.id]=q));
    const pool=h.ids.map(id=>map[id]).filter(Boolean);
    if(!pool.length)return toast("تعذّر العثور على أسئلة هذا الاختبار.","warn");
    if(pool.length<h.ids.length)toast("بعض أسئلة هذا الاختبار لم تعد متاحة.","info");
    makeQuiz(pool,{count:0,shuf:false,skip:false},h.title);
  });
  if(W)$("#wk").onclick=()=>{state.screen="progress";makeQuiz(ids.flatMap(id=>info(id).all.filter(weakQ)),{count:0,shuf:true,skip:false,noHist:true},"كل أخطائي")};
}

/* ---------- مراجعة أخطاء مادة ---------- */

    <div class="actions">${W.length?`<button class="btn" id="wk">${icon("refresh",20)}اختبرني فيها</button>`:""}<button class="btn ghost" id="rs">${icon("x",20)}تصفير تقدم المادة</button></div></section>`;

/* ---------- فهرس المحتوى (للمسؤول) ---------- */
function viewContent(){
  const line=x=>{const I=info(x.id);return `<div class="row"><span ${x.missing?'class="warn"':""}>${esc(x.name)} <span class="codechip">${esc(x.code)}</span></span><small>${I.mcq.length} اختيار · ${I.tf.length} صح/خطأ${I.past.length?" · "+I.past.length+" سابق":""}${I.bad?` <span class="warn">· ${I.bad} غير مقروء</span>`:""}</small></div>`};
  view.innerHTML=`<section class="screen"><div class="hero"><h1>فهرس المحتوى</h1><p>${SPECS.length} تخصص · ${ALLSUBJ.length} مادة · ${ALLSUBJ.reduce((a,id)=>a+info(id).total,0)} سؤال</p></div>`+
    (ISSUES.length?`<div class="note"><b class="warn">تنبيهات (${ISSUES.length}) — صحّحها لتفادي الأخطاء:</b><br>${ISSUES.map(esc).join("<br>")}</div>`:`<div class="note" style="color:var(--ok)">${icon("check",16,3)} البيانات سليمة، لا توجد أخطاء.</div>`)+
    SPECS.map(S=>{
      const qs=x=>info(x.id).total,tq=S.levels.reduce((n,L)=>n+L.terms.reduce((m,T)=>m+T.subjects.reduce((k,x)=>k+qs(x),0),0),0);
      return `<details class="panel tree"><summary>${icon(S.icon||"cog",20)}<b style="flex:1">${esc(S.name)}</b><small style="color:var(--muted)">${S.levels.length} مستوى · ${tq} سؤال</small></summary>`+
      (S.levels.map(L=>{const lq=L.terms.reduce((m,T)=>m+T.subjects.reduce((k,x)=>k+qs(x),0),0);
        return `<details style="margin-top:4px"><summary><b style="flex:1">${esc(L.name)}</b><small style="color:var(--muted)">${L.terms.length} ترم · ${lq} سؤال</small></summary>`+
        (L.terms.map(T=>{const tq2=T.subjects.reduce((k,x)=>k+qs(x),0);
          return `<details style="margin-top:2px"><summary><b style="flex:1">${esc(T.name)}</b><small style="color:var(--muted)">${T.subjects.length} مادة · ${tq2} سؤال</small></summary>`+
          (T.subjects.length?T.subjects.map(line).join(""):`<div class="row warn">لا توجد مواد</div>`)+`</details>`}).join("")||`<div class="row warn">لا توجد أترام</div>`)+`</details>`}).join("")||`<div class="row warn">لا توجد مستويات بعد</div>`)+`</details>`}).join("")+`</section>`;
}

/* ---------- إرسال طلب إضافة أسئلة عبر واتساب ---------- */
const waOpen=m=>window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(m),"_blank");
const WL="━━━━━━━━━━";
function addMsg(o){
  return `*📚 طلب إضافة أسئلة جديدة*\n${WL}\n👤 الاسم: ${o.nm||"—"}\n🎓 التخصص: ${o.spec}\n📶 المستوى: ${o.level}\n🗓 الترم: ${o.term}\n📖 المادة: ${o.subj}${o.code?"\n🔑 الشيفرة: "+o.code:""}\n📅 التاريخ: ${new Date().toLocaleDateString("ar")}\n${WL}\n*✍️ الأسئلة:*\n\n${o.tx||"(لا توجد أسئلة مرفقة — أرجو إضافة أسئلة لهذه المادة)"}\n\n${WL}\n_أُرسلت من منصة الكويزات_`;
}
const FMT_HINT="اختيار من متعدد: سطر السؤال ثم الاختيارات، وضع * بعد الصحيح، وسطر فارغ بين الأسئلة.\nصح/خطأ: سطر لكل سؤال وينتهي بـ ✔ أو ✘.";
function askHaveQuestions(x){
  const ctx=[x.spec,x.level,x.term,x.name];
  showModal({icon:"inbox",color:x.color,title:"هل لديك أسئلة لهذه المادة؟",sub:"يمكنك كتابة أسئلتك الآن وإرسالها، أو طلب إضافة المادة فقط.",crumbs:ctx,
    body:`<div class="mlist">
      <button class="tile" style="--tc:#12A37A" data-a="yes"><span class="ico">${icon("edit",26)}</span><span class="tx"><b>نعم، لدي أسئلة</b><small>اكتبها ثم أرسلها</small></span><span class="go">${icon("chev",20)}</span></button>
      <button class="tile" style="--tc:#3C7BE0" data-a="no"><span class="ico">${icon("send",26)}</span><span class="tx"><b>لا، أرسل الطلب فقط</b><small>سنضيف أسئلة هذه المادة لاحقاً</small></span><span class="go">${icon("chev",20)}</span></button></div>`,
    bind:m=>{
      m.querySelector('[data-a="yes"]').onclick=()=>writeQuestions(x);
      m.querySelector('[data-a="no"]').onclick=()=>{closeModal();waOpen(addMsg({nm:USER?fullName():"",spec:x.spec,level:x.level,term:x.term,subj:x.name,code:x.code}));toast("تم تجهيز الطلب في واتساب.","ok")};
    }});
}
function writeQuestions(x,keep=""){
  showModal({icon:"edit",color:x.color,title:"اكتب أسئلتك",sub:x.name,crumbs:[x.spec,x.level,x.term],back:()=>askHaveQuestions(x),
    body:`<div class="field" style="margin-top:0"><label for="qTx">الأسئلة</label><textarea id="qTx" style="min-height:170px" placeholder="السؤال؟&#10;الاختيار الأول&#10;الاختيار الصحيح*&#10;الاختيار الثالث&#10;&#10;جملة صح أو خطأ ✔">${esc(keep)}</textarea></div><details><summary>طريقة الكتابة</summary><div class="hint">${esc(FMT_HINT)}</div></details>`,
    foot:`<button class="btn" data-a="go">${icon("send",20)}إرسال عبر واتساب</button>`,
    bind:m=>{
      const t=m.querySelector("#qTx");
      m.querySelector('[data-a="go"]').onclick=()=>{
        const tx=t.value.trim();if(!tx){toast("اكتب سؤالاً واحداً على الأقل، أو ارجع واختر «لا».","err");t.focus();return}
        closeModal();waOpen(addMsg({nm:USER?fullName():"",spec:x.spec,level:x.level,term:x.term,subj:x.name,code:x.code,tx}));toast("تم تجهيز أسئلتك في واتساب.","ok");
      };
      setTimeout(()=>t.focus(),280);
    }});
}

/* ---------- إضافة أسئلة / اقتراحات ---------- */
const ADD={sid:null,other:false,tx:"",nm:null};
function addRefresh(){if(state.screen==="add")viewContact()}
const addTile=(col,ic,t,sm,badge,attr)=>`<button class="tile" style="--tc:${col}" ${attr}><span class="ico">${icon(ic,26)}</span><span class="tx"><b>${esc(t)}</b><small>${sm}</small></span>${badge||`<span class="go">${icon("chev",20)}</span>`}</button>`;
function addPickSpec(){
  showModal({icon:"layers",title:"اختر التخصص",sub:"حدّد المادة التي تريد إضافة أسئلتها.",step:1,steps:4,
    body:`<div class="mlist">`+SPECS.map((S,i)=>addTile(S.color||COLORS[i%COLORS.length],S.icon||"cog",S.name,S.levels.length?S.levels.length+" مستوى":"قريباً",S.levels.length?"":`<span class="tag new">قريباً</span>`,`data-i="${i}"`)).join("")+
      addTile("#62708F","plus","مادة أخرى / غير مذكورة","اكتب اسمها ضمن رسالتك","",'data-o="1"')+`</div>`,
    bind:m=>{
      m.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>addPickLevel(+b.dataset.i));
      m.querySelector("[data-o]").onclick=()=>{ADD.sid=null;ADD.other=true;closeModal();addRefresh();toast("اكتب اسم المادة داخل الأسئلة.","info")};
    }});
}
function addPickLevel(a){
  const S=SPECS[a];if(!S)return;
  if(!S.levels.length)return toast("لم تتم إضافة مستويات لهذا التخصص بعد. استخدم «مادة أخرى».","warn");
  const col=S.color||COLORS[a%COLORS.length];
  showModal({icon:S.icon||"cog",color:col,title:"اختر المستوى",step:2,steps:4,crumbs:[S.name],back:addPickSpec,
    body:`<div class="mlist">`+S.levels.map((l,i)=>addTile(col,"steps",l.name,l.terms.length+" ترم","",`data-i="${i}"`)).join("")+`</div>`,
    bind:m=>m.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>addPickTerm(a,+b.dataset.i))});
}
function addPickTerm(a,b){
  const S=SPECS[a],L=S&&S.levels[b];if(!L)return;
  if(!L.terms.length)return toast("لا توجد أترام لهذا المستوى بعد.","warn");
  const col=S.color||COLORS[a%COLORS.length];
  showModal({icon:"calendar",color:col,title:"اختر الترم",step:3,steps:4,crumbs:[S.name,L.name],back:()=>addPickLevel(a),
    body:`<div class="mlist">`+L.terms.map((t,i)=>addTile(col,"calendar",t.name,t.subjects.length+" مادة","",`data-i="${i}"`)).join("")+`</div>`,
    bind:m=>m.querySelectorAll("[data-i]").forEach(x=>x.onclick=()=>addPickSubj(a,b,+x.dataset.i))});
}
function addPickSubj(a,b,c){
  const S=SPECS[a],L=S&&S.levels[b],T=L&&L.terms[c];if(!T)return;
  if(!T.subjects.length)return toast("لا توجد مواد في هذا الترم بعد.","warn");
  showModal({icon:"book",color:S.color||COLORS[a%COLORS.length],title:"اختر المادة",step:4,steps:4,crumbs:[S.name,L.name,T.name],back:()=>addPickTerm(a,b),
    body:`<div class="mlist">`+T.subjects.map(x=>{const n=info(x.id).total;
      return addTile(x.color,x.icon,x.name,n?n+" سؤال":"لا توجد أسئلة بعد",n?"":`<span class="tag new">جديدة</span>`,`data-id="${x.id}"`)}).join("")+`</div>`,
    bind:m=>m.querySelectorAll("[data-id]").forEach(x=>x.onclick=()=>{ADD.sid=x.dataset.id;ADD.other=false;closeModal();addRefresh()})});
}
function viewContact(){
  const add=state.screen==="add",x=ADD.sid&&SUBJECTS[ADD.sid];
  const box=x
    ?`<button class="pickbox" id="pk" style="--tc:${x.color}"><span class="ico">${icon(x.icon,24)}</span><span class="tx"><b>${esc(x.name)}</b><small>${esc(x.spec)} › ${esc(x.level)} › ${esc(x.term)}</small></span><span class="go">${icon("edit",18)}</span></button>`
    :ADD.other
    ?`<button class="pickbox" id="pk"><span class="ico" style="background:#62708F">${icon("plus",24)}</span><span class="tx"><b>مادة أخرى / غير مذكورة</b><small>اكتب اسم المادة والتخصص داخل رسالتك</small></span><span class="go">${icon("edit",18)}</span></button>`
    :`<button class="pickbox empty" id="pk"><span class="ico">${icon("layers",24)}</span><span class="tx"><b>اضغط لاختيار المادة</b><small>التخصص › المستوى › الترم › المادة</small></span><span class="go">${icon("chev",20)}</span></button>`;
  const nm0=ADD.nm==null?USER:ADD.nm;
  view.innerHTML=`<section class="screen"><div class="hero"><h1>${add?"إضافة أسئلة":"اقتراحات"}</h1><p>${add?"اختر المادة من القائمة المنبثقة، اكتب الأسئلة بالصيغة الموضحة ثم اضغط «إضافة» لتُفتح رسالة منظمة في واتساب.":"اكتب اقتراحك أو ملاحظتك وسنصلك عبر واتساب."}</p></div>
    <div class="panel"><div class="field" style="margin-top:0"><label>اسمك (اختياري)</label><input type="text" id="nm" maxlength="40" value="${esc(nm0)}"></div>
    ${add?`<div class="field"><label>المادة</label>${box}</div>`:""}
    <div class="field"><label>${add?"الأسئلة":"اقتراحك"}</label><textarea id="tx" placeholder="${add?"السؤال؟&#10;الاختيار الأول&#10;الاختيار الصحيح*&#10;الاختيار الثالث&#10;&#10;جملة صح أو خطأ ✔":"اكتب هنا..."}">${esc(add?ADD.tx:"")}</textarea>${add?`<details><summary>طريقة الكتابة</summary><div class="hint">${esc(FMT_HINT)}</div></details>`:""}</div></div>
    <div class="actions"><button class="btn" id="send">${icon("send",20)}${add?"إضافة":"إرسال الاقتراح"}</button></div></section>`;
  $("#nm").oninput=e=>{ADD.nm=e.target.value};
  if(add){$("#tx").oninput=e=>{ADD.tx=e.target.value};$("#pk").onclick=addPickSpec}
  $("#send").onclick=()=>{
    const tx=$("#tx").value.trim();if(!tx){toast("اكتب النص أولاً.","err");$("#tx").focus();return}
    const nm=$("#nm").value.trim()||"—",d=new Date().toLocaleDateString("ar"),L="━━━━━━━━━━";
    if(add){
      if(!x&&!ADD.other){toast("اختر المادة أولاً.","err");$("#pk").focus();return}
      waOpen(addMsg({nm,spec:x?x.spec:"—",level:x?x.level:"—",term:x?x.term:"—",subj:x?x.name:"مادة أخرى / غير مذكورة",code:x?x.code:"",tx}));
    }else waOpen(`*💡 اقتراح جديد*\n${L}\n👤 الاسم: ${nm}\n📅 التاريخ: ${d}\n${L}\n*الاقتراح:*\n\n${tx}\n\n${L}\n_أُرسل من منصة الكويزات_`);
  };
}

/* ---------- الإعدادات ---------- */
function viewSettings(){
  const th=root.dataset.theme,chips=(a,cur,at)=>a.map(x=>`<button class="chip ${cur===x[0]?"on":""}" data-${at}="${x[0]}">${x[1]}</button>`).join("");
  view.innerHTML=`<section class="screen"><div class="hero"><h1>الإعدادات</h1><p>تُحفظ تلقائياً على جهازك.</p></div>${state.live?`<div class="actions" style="margin:0 0 14px"><button class="btn" id="resumeQ">${icon("next",20)}العودة إلى الاختبار</button></div>`:""}
    <div class="panel"><div class="field" style="margin-top:0"><label for="sNm">اسمك</label><div class="inwrap" id="sNmW">${icon("user",20)}<b class="pfx">م/</b><input type="text" id="sNm" maxlength="30" value="${esc(USER)}" placeholder="اكتب اسمك" autocomplete="given-name"></div></div>
    <div class="actions" style="margin-top:12px"><button class="btn" id="sNmSave">${icon("edit",20)}حفظ الاسم</button></div></div>
    <div class="panel"><div class="field" style="margin-top:0"><label>المظهر</label><div class="chips">${chips([["light","نهاري"],["dark","ليلي"]],th,"th")}</div></div>
    <div class="field"><label>حجم الخط</label><div class="chips">${chips([[90,"صغير"],[100,"متوسط"],[115,"كبير"]],U.fs,"fs")}</div></div></div>
    <div class="panel">${tg("sShufQ","خلط ترتيب الأسئلة افتراضياً",U.shufQ)}${tg("sShufO","خلط ترتيب الاختيارات",U.shufO)}${tg("sSkip","عدم تكرار الأسئلة السابقة افتراضياً",U.skipSeen)}
    <div class="field"><label>عدد الأسئلة الافتراضي (0 = الكل)</label><input type="number" id="sCnt" min="0" value="${U.count}"></div></div>
    <div class="actions"><button class="btn ghost" id="rst">${icon("x",20)}تصفير كل التقدم</button></div></section>`;
  if($("#resumeQ"))$("#resumeQ").onclick=()=>go("quiz");
  const K={sShufQ:"shufQ",sShufO:"shufO",sSkip:"skipSeen"};
  view.querySelectorAll(".sw").forEach(b=>b.onclick=()=>{flip(b);U[K[b.id]]=b.classList.contains("on");saveU()});
  view.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{setTheme(b.dataset.th,true);viewSettings()});
  view.querySelectorAll("[data-fs]").forEach(b=>b.onclick=()=>{U.fs=+b.dataset.fs;saveU();applyFS();viewSettings()});
  const saveNm=()=>{const r=cleanName($("#sNm").value),w=$("#sNmW");
    if(r.err){toast(r.err,"err");w.classList.remove("bad");void w.offsetWidth;w.classList.add("bad");$("#sNm").focus();return}
    if(r.v===USER){toast("الاسم لم يتغير.","info");return}
    saveName(r.v);$("#sNm").value=r.v;toast("تم حفظ الاسم: م/ "+r.v,"ok")};
  $("#sNmSave").onclick=saveNm;$("#sNm").onkeydown=e=>{if(e.key==="Enter")saveNm()};$("#sNm").oninput=()=>$("#sNmW").classList.remove("bad");
  $("#sCnt").onchange=e=>{U.count=Math.max(0,+e.target.value||0);saveU()};
  $("#rst").onclick=()=>ask({title:"تصفير كل التقدم؟",msg:"سيتم حذف تقدمك وسجل اختباراتك نهائياً. اسمك وإعداداتك ستبقى كما هي.",yes:"نعم، صفّر",danger:true,onYes:()=>{PROG={};HIST=[];store.set("prog",PROG);store.set("hist",HIST);toast("تم تصفير التقدم. اسمك محفوظ.","ok")}});
}

/* ---------- الوضع الليلي + الشعار + الترحيب ---------- */
const root=document.documentElement,themeBtn=$("#themeBtn");
function setTheme(t,save){root.dataset.theme=t;themeBtn.innerHTML=icon(t==="dark"?"sun":"moon",20);if(save){U.theme=t;saveU()}}
setTheme(U.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
themeBtn.onclick=()=>{setTheme(root.dataset.theme==="dark"?"light":"dark",true);if(state.screen==="settings")viewSettings()};
const applyFS=()=>{$(".app").style.zoom=U.fs/100};applyFS();

$("#splashLogo").innerHTML=logoSVG("s");
$("#brandLogo").innerHTML=logoSVG("h");
$("#phoneLink").innerHTML=icon("phone",16)+PHONE;
const closeSplash=()=>{const s=$("#splash");if(!s)return;s.classList.add("out");setTimeout(()=>s.remove(),650)};
function splashText(){
  $("#splash h1").innerHTML=USER?"مرحباً بالباش مهندس "+esc(USER)+"<br>أهلاً بعودتك":"مرحباً بكم في الجامعة الإماراتية الدولية";
  $("#startBtn").textContent=USER?"تابع":"ابدأ الآن";
}
drawUser();splashText();
$("#startBtn").onclick=()=>{if(USER)closeSplash();else askName(()=>{closeSplash()})};

document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-code]");if(!b)return;
  const c=b.dataset.code;(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>toast("تم نسخ الشيفرة: "+c,"ok"),()=>toast("الشيفرة: "+c,"info"))});
const SCREENS={spec:pageSpec,level:pageLevel,term:pageTerm,subject:pageSubject,setup:viewSetup,quiz:viewQuiz,result:viewResult,random:viewRandom,past:viewPast,progress:viewProgress,review:viewReview,content:viewContent,add:viewContact,sug:viewContact,settings:viewSettings};
render();

/* ---------- تنبيه الخروج ---------- */
let EXITING=false;
window.addEventListener("beforeunload",e=>{if(EXITING)return;if(state.screen==="quiz"||state.live){e.preventDefault();e.returnValue=""}});
/* المتصفحات تتجاهل سجل التنقل المضاف قبل أي لمس للصفحة، لذلك نضيفه عند أول تفاعل */
let ARMED=false;
const arm=()=>{if(ARMED)return;ARMED=true;try{history.pushState({g:1},"")}catch(e){}["pointerdown","touchstart","click","keydown"].forEach(t=>document.removeEventListener(t,arm,true))};
["pointerdown","touchstart","click","keydown"].forEach(t=>document.addEventListener(t,arm,true));
window.addEventListener("popstate",()=>{
  if(EXITING||!ARMED)return;
  try{history.pushState({g:1},"")}catch(e){}
  if(MODAL){if(MODAL.canX)closeModal();return}
  if(drawer.classList.contains("on")){drawerOpen(false);return}
  if(state.screen!=="spec"){nav("spec");return}   /* خارج الرئيسية: الرجوع يعيدك للرئيسية */
  ask({title:"هل أنت متأكد من الخروج؟",msg:"سيتم الخروج من المنصة.",yes:"نعم، اخرج",danger:true,
    onYes:()=>{EXITING=true;try{history.go(-2)}catch(e){}setTimeout(()=>{try{window.close()}catch(e){}setTimeout(()=>{location.replace("about:blank")},250)},350)}});
});
</script>
</body>
</html>
